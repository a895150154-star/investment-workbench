    html[data-app-boot="loading"]{background:#f8f9fa;color-scheme:light}
    html[data-app-boot="loading"]:not(.light){background:#17191d;color-scheme:dark}
    html[data-app-boot="loading"] body{visibility:hidden;background:transparent!important}
    html[data-app-boot="loading"] #workbenchBootStatus{display:grid;visibility:visible;color:#646970}
    html[data-app-boot="loading"]:not(.light) #workbenchBootStatus{color:#b1b5bf}

  <script id="workbenchBoot">
    (()=>{
      const root=document.documentElement;
      // Client identity stays stable when a desktop window is resized.
      const phone=navigator.userAgentData?.mobile===true||/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
      window.workbenchClient=Object.freeze({desktop:!phone,mobile:phone});
      root.dataset.workbenchClient=phone?'mobile':'desktop';
      root.dataset.appBoot='loading';
      let theme='light';
      try{theme=JSON.parse(localStorage.getItem('vra-design-today-v2-layout')||'null')?.theme||theme;}catch{}
      root.classList.toggle('light',theme==='light');
      document.addEventListener('DOMContentLoaded',()=>{
        // All deferred scripts and their initializers finish before these frames.
        // Visibility preserves the measurements used by the final card layout.
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          root.dataset.appBoot='ready';
          document.getElementById('workbenchBootStatus')?.remove();
          performance.mark('workbench-ready');
        }));
      },{once:true});
    })();
  </script>
